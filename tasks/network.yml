---
- name: Setup sandbox netdev
  ansible.builtin.template:
    src: sandbox.netdev.j2
    dest: "{{ sandboxing_networkd_directory }}/{{ sandboxing_networkd_unit_prefix }}-{{ sandboxing_name }}.netdev"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd-networkd - role {{ role_name }}

- name: Setup sandbox network
  ansible.builtin.template:
    src: sandbox.network.j2
    dest: "{{ sandboxing_networkd_directory }}/{{ sandboxing_networkd_unit_prefix }}-{{ sandboxing_name }}.network"
    owner: root
    group: root
    mode: "0644"
  vars:
    sandboxing_tap_host_octet: "{{ (sandboxing_index | int * sandboxing_network_size) + 1 }}"
  notify: Reload systemd-networkd - role {{ role_name }}

- name: Bind sandbox interface to sandbox firewalld zone
  notify: Reload firewalld - role {{ role_name }}
  ansible.posix.firewalld:
    zone: "{{ sandboxing_firewalld_default_zone }}"
    interface: "{{ sandboxing_name }}"
    state: enabled
    permanent: true
    # applies to config files even if firewalld is not running
    offline: true

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Check administrative state of the interface
  register: sandboxing_networkd_device_state
  changed_when: false
  ansible.builtin.command:
    argv:
      - ip
      - -json
      - link
      - show
      - dev
      - "{{ sandboxing_name }}"

- name: Set administrative state to up
  when: "'UP' not in (sandboxing_networkd_device_state.stdout | from_json | map(attribute='flags') | flatten)"
  changed_when: true
  ansible.builtin.command:
    argv:
      - ip
      - link
      - set
      - dev
      - "{{ sandboxing_name }}"
      - up
