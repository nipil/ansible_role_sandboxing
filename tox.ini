[tox]
envlist = minimal, latest
skip_missing_interpreters = true
isolated_build = true

# NOTE:
#   The `ansible` top-level key in molecule/default/molecule.yml requires
#   molecule >= 25.9 (which requires ansible-core >= 2.16 via ansible-compat).
#   Hence 2.16 is the effective minimum ansible-core this matrix can run.
#
#   The role itself is compatible with older ansible-core (>= 2.14) as long
#   as integer arithmetic does not rely on task `vars:` native types (see
#   tasks/validation.yml "Validate sandboxing address space stays in the same
#   /16 as base", which casts with `| int` for this reason).
#
#   ansible-core <= 2.19 supports controller Python 3.10-3.13 (not 3.14+),
#   so it must not run on Python 3.14+ (e.g. AttributeError on import).
#
#   A matching interpreter must be available (e.g. `py3.11`) when running
#   the `minimal` env. `skip_missing_interpreters` above lets tox skip it
#   gracefully when no such interpreter is installed.

[testenv:minimal]
description = Run molecule with ansible-core pinned to the declared minimum (2.16) on a compatible Python
base_python = python-3.11/bin/python3 # locally installed
deps =
    molecule==25.9.*
    molecule-podman==2.0.*
    ansible-core==2.16.*
    selinux
commands_pre =
    ansible-galaxy collection install ansible.posix:==1.6.1
    ansible-galaxy collection install --requirements molecule/requirements-collections.yml
commands =
    molecule test --scenario-name default {posargs}

[testenv:latest]
description = Run molecule with the latest ansible-core
base_python = python3.13
deps =
    molecule
    molecule-podman
    ansible-core
    selinux
commands_pre =
    ansible-galaxy collection install -r {toxinidir}/requirements.yml
    ansible-galaxy collection install --requirements molecule/requirements-collections.yml
commands =
    molecule test --scenario-name default {posargs}