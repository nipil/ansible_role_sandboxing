[tox]
envlist = min, latest
skip_missing_interpreters = true
isolated_build = true

# NOTE:
#   The minimum ansible-core release (2.14) supports Python 3.9-3.11 only.
#   It MUST run on a Python version that is <= 3.11, otherwise importing
#   ansible-core crashes (e.g. AttributeError: 'property' object has no
#   attribute 'items' on Python 3.13).
#   A matching interpreter must be available (e.g. `py3.11`) when running
#   the `min` env. `skip_missing_interpreters` above lets tox skip it
#   gracefully when no such interpreter is installed.

[testenv:min]
description = Run molecule with ansible-core pinned to the declared minimum (2.14) on a compatible Python
base_python = python3.11
deps =
    molecule==24.9.*
    molecule-podman==2.0.*
    # latest ansible.posix release compatible with ansible-core 2.14
    ansible-core==2.14.*
    selinux
commands_pre =
    # pin ansible.posix so it stays compatible with ansible-core 2.14
    ansible-galaxy collection install ansible.posix:==1.6.1
    ansible-galaxy collection install --requirements molecule/requirements-collections.yml
commands =
    molecule test --scenario-name default {posargs}

[testenv:latest]
description = Run molecule with the latest ansible-core
base_python = python3.13
deps =
    molecule
    molecule-podman
    ansible-core
    selinux
commands_pre =
    ansible-galaxy collection install -r {toxinidir}/requirements.yml
    ansible-galaxy collection install --requirements molecule/requirements-collections.yml
commands =
    molecule test --scenario-name default {posargs}